<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PerfumeRO Co. — Catálogo Multimarca</title>
<meta name="description" content="Catálogo multimarca de perfumería. Todas las marcas, todas las fragancias, en un solo lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫙</text></svg>">
<style>
  :root{
    --black: #0b0b0c;
    --black-soft: #151517;
    --gold: #d4af5a;
    --gold-light: #e9cd8a;
    --gold-dim: #a9833c;
    --cream: #f7f1e6;
    --cream-dim: #efe6d3;
    --text-on-dark: #f3ead4;
    --text-muted: #cdbf9d;
    --radius: 14px;
    --shadow: 0 10px 30px rgba(0,0,0,.25);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    font-family: 'Montserrat', sans-serif;
    color: var(--black-soft);
    background: linear-gradient(180deg, #fffdf8 0%, var(--cream) 40%, #fbf5e8 100%);
    background-attachment: fixed;
  }
  h1,h2,h3,.serif{ font-family: 'Playfair Display', serif; }
  a{ color: inherit; text-decoration: none; }
  img{ max-width:100%; display:block; }
  .container{ max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Header / Hero ---------- */
  header.hero{
    background: radial-gradient(ellipse at top, #1c1a16 0%, var(--black) 60%, #000 100%);
    color: var(--text-on-dark);
    padding: 56px 24px 70px;
    text-align: center;
    position: relative;
    overflow:hidden;
  }
  header.hero::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 0%, rgba(212,175,90,.18), transparent 55%);
    pointer-events:none;
  }
  .logo-wrap{ position:relative; z-index:1; }
  .logo-wrap img{ max-width: 230px; margin: 0 auto 10px; filter: drop-shadow(0 6px 18px rgba(212,175,90,.25)); }
  header.hero .tagline{
    font-family:'Playfair Display', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--gold-light);
    letter-spacing: .03em;
    margin: 6px 0 28px;
  }

  nav.view-switch{
    position: relative; z-index:1;
    display:inline-flex;
    gap: 6px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(212,175,90,.35);
    border-radius: 999px;
    padding: 6px;
    backdrop-filter: blur(4px);
  }
  nav.view-switch button{
    font-family:'Montserrat', sans-serif;
    font-size: .8rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-weight: 600;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .25s ease;
  }
  nav.view-switch button.active{
    background: linear-gradient(135deg, var(--gold-light), var(--gold-dim));
    color: #1a1407;
    box-shadow: 0 4px 14px rgba(212,175,90,.35);
  }

  /* ---------- Brand carousel ---------- */
  .brand-carousel-section{
    background: var(--black-soft);
    padding: 26px 0;
    border-top: 1px solid rgba(212,175,90,.15);
    border-bottom: 1px solid rgba(212,175,90,.15);
    overflow: hidden;
  }
  .brand-carousel{
    display:flex;
    gap: 46px;
    align-items:center;
    width: max-content;
    animation: scrollBrands 30s linear infinite;
  }
  .brand-carousel-section:hover .brand-carousel{ animation-play-state: paused; }
  @keyframes scrollBrands{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }
  .brand-logo-item{
    display:flex; align-items:center; justify-content:center;
    height: 54px;
    opacity: .85;
    transition: opacity .2s ease, transform .2s ease;
    white-space:nowrap;
  }
  .brand-logo-item:hover{ opacity:1; transform: translateY(-2px); }
  .brand-logo-item img{ height: 40px; width:auto; object-fit:contain; }
  .brand-logo-item.text-logo{
    font-family:'Playfair Display', serif;
    font-size: 1.15rem;
    color: var(--gold-light);
    letter-spacing:.03em;
  }
  .brand-carousel-empty{
    color: var(--text-muted);
    font-size: .85rem;
    text-align:center;
    width:100%;
    letter-spacing:.04em;
  }

  /* ---------- Section titles ---------- */
  .section-title{
    text-align:center;
    margin: 56px 0 8px;
  }
  .section-title h2{
    font-size: 2rem;
    margin:0;
    color: var(--black-soft);
  }
  .section-title .underline{
    width: 70px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    margin: 14px auto 0;
  }

  /* ---------- Category nav chips ---------- */
  .chip-row{
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
    margin: 28px 0 10px;
  }
  .chip{
    font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; font-weight:600;
    padding: 9px 18px; border-radius:999px;
    border: 1px solid rgba(169,131,60,.4);
    background: #fff;
    color: var(--gold-dim);
    cursor:pointer;
    transition: all .2s ease;
  }
  .chip:hover, .chip.active{
    background: var(--black-soft);
    color: var(--gold-light);
    border-color: var(--black-soft);
  }

  /* ---------- Product grid ---------- */
  main{ padding-bottom: 80px; }
  .category-block{ margin-top: 10px; }
  .category-heading{
    display:flex; align-items:baseline; gap:12px;
    margin: 46px 0 18px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(169,131,60,.25);
  }
  .category-heading h3{
    font-size: 1.5rem; margin:0; color: var(--black-soft);
  }
  .category-heading .count{
    font-size:.8rem; color: var(--gold-dim); font-weight:600;
  }

  .product-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 22px;
  }
  .product-card{
    background:#fff;
    border-radius: var(--radius);
    overflow:hidden;
    box-shadow: var(--shadow);
    border: 1px solid rgba(169,131,60,.12);
    transition: transform .25s ease, box-shadow .25s ease;
    display:flex; flex-direction:column;
  }
  .product-card:hover{
    transform: translateY(-5px);
    box-shadow: 0 16px 36px rgba(0,0,0,.18);
  }
  .product-img{
    aspect-ratio: 1 / 1;
    background: #faf6ec;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .product-img img{ width:100%; height:100%; object-fit: cover; }
  .product-info{ padding: 14px 16px 18px; flex:1; display:flex; flex-direction:column; gap:6px; }
  .product-brand{
    font-size:.68rem; text-transform:uppercase; letter-spacing:.09em;
    color: var(--gold-dim); font-weight:700;
  }
  .product-name{
    font-family:'Playfair Display', serif;
    font-size: 1rem; line-height:1.3;
    color: var(--black-soft);
    min-height: 2.4em;
  }
  .product-price{
    margin-top:auto;
    font-weight:700; font-size: 1.05rem;
    color: var(--black-soft);
  }
  .product-link{
    font-size:.72rem; color: var(--gold-dim); text-decoration:underline;
    margin-top:2px;
  }
  .badge-row{ display:flex; gap:6px; flex-wrap:wrap; margin: 2px 0 4px; }
  .badge{
    font-size:.62rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    padding: 3px 9px; border-radius:999px;
    border: 1px solid rgba(169,131,60,.4);
  }
  .badge-gender{ background:#faf6ec; color: var(--gold-dim); }
  .badge-gender.fem{ color:#a85a7a; border-color: rgba(168,90,122,.35); }
  .badge-gender.masc{ color:#3f6c91; border-color: rgba(63,108,145,.35); }
  .badge-gender.uni{ color: var(--gold-dim); }
  .badge-available{ background: var(--black-soft); color: var(--gold-light); border-color: var(--black-soft); }
  .product-notes{
    font-size:.74rem; line-height:1.4; color:#7a6a4a;
  }
  .product-notes b{ color: var(--black-soft); }
  .product-desc{
    font-size:.78rem; line-height:1.45; color:#5a5247; margin: 2px 0 0;
  }

  .empty-state{
    text-align:center;
    color: var(--text-muted);
    background: var(--black-soft);
    border-radius: var(--radius);
    padding: 50px 24px;
    margin: 20px 0 0;
  }
  .empty-state p{ font-family:'Playfair Display', serif; font-style:italic; font-size:1.1rem; color: var(--gold-light); margin:0; }

  /* ---------- Brand view ---------- */
  .brand-block{ margin-top: 54px; }
  .brand-block-header{
    display:flex; align-items:center; gap:16px;
    margin-bottom: 22px;
  }
  .brand-block-header .brand-logo-sm{
    height: 46px; width:46px; border-radius:50%;
    background: var(--black-soft);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .brand-block-header .brand-logo-sm img{ height:70%; width:70%; object-fit:contain; }
  .brand-logo-sm-initial{
    font-family:'Playfair Display', serif; font-weight:700; font-size:1.3rem;
    color: var(--gold-light);
  }
  .brand-block-header h3{
    font-size:1.6rem; margin:0; color: var(--black-soft);
  }
  .brand-category-group{ margin: 18px 0 30px; }
  .brand-category-group h4{
    font-size: .95rem; text-transform:uppercase; letter-spacing:.06em;
    color: var(--gold-dim); margin: 0 0 12px;
  }

  footer{
    background: var(--black);
    color: var(--text-muted);
    text-align:center;
    padding: 34px 24px;
    font-size: .8rem;
    letter-spacing: .03em;
  }
  footer .serif{ color: var(--gold-light); font-size: 1rem; }

  @media (max-width: 560px){
    header.hero{ padding: 40px 16px 50px; }
    .logo-wrap img{ max-width: 170px; }
    .section-title h2{ font-size: 1.6rem; }
  }
</style>
</head>

/* ========================================================= */

function money(n){
  if (typeof n !== 'number') return n;
  return '$ ' + n.toLocaleString('es-CO', { maximumFractionDigits:0 });
}

const PLACEHOLDER_IMG = "data:image/svg+xml," + encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <rect width="220" height="220" fill="#faf6ec"/>
  <g fill="none" stroke="#b08d3e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M95 40 h30 v18 h-30 z"/>
    <path d="M100 58 h20 v14 h-20 z"/>
    <path d="M78 150 q0 -55 22 -72 h20 q22 17 22 72 q0 24 -32 24 q-32 0 -32 -24 z"/>
    <path d="M78 150 h64" stroke="#d9c38f"/>
    <path d="M70 185 h80" opacity=".5"/>
    <path d="M60 40 q10 8 2 16" stroke="#cdb469"/>
    <path d="M150 48 q-10 6 -4 16" stroke="#cdb469"/>
    <path d="M148 55 l20 -10" stroke="#cdb469"/>
  </g>
</svg>
`);

function renderBrandCarousel(){
  const el = document.getElementById('brandCarousel');
  if (BRANDS.length === 0){
    el.innerHTML = '<div class="brand-carousel-empty">Próximamente se irán sumando marcas…</div>';
    return;
  }
  const items = BRANDS.map(b => {
    const inner = b.logo
      ? `<img src="${b.logo}" alt="${b.name}">`
      : b.name;
    return `<a class="brand-logo-item${b.logo ? '' : ' text-logo'}" href="#marca-${b.slug}" onclick="switchView('marca')">${inner}</a>`;
  });
  // duplicamos para loop continuo
  el.innerHTML = items.concat(items).join('');
}

function renderCategoryChips(){
  const el = document.getElementById('categoryChips');
  const chips = ['Todas', ...CATEGORIES].map((c,i) => {
    const active = i===0 ? ' active' : '';
    return `<button class="chip${active}" data-cat="${i===0?'__all__':c}">${c}</button>`;
  });
  el.innerHTML = chips.join('');
  el.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      el.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      renderCategoriaView(chip.dataset.cat);
    });
  });
}

function genderClass(g){
  if (g === 'Femenino') return 'fem';
  if (g === 'Masculino') return 'masc';
  return 'uni';
}

function productCard(p){
  const img = p.image || PLACEHOLDER_IMG;
  const notesPreview = p.notes && p.notes.length
    ? `<span class="product-notes"><b>Notas:</b> ${p.notes.join(', ')}</span>`
    : '';
  return `
    <div class="product-card">
      <div class="product-img"><img src="${img}" alt="${p.name}" loading="lazy"></div>
      <div class="product-info">
        <span class="product-brand">${p.brand}</span>
        <span class="product-name">${p.name}</span>
        <div class="badge-row">
          <span class="badge badge-gender ${genderClass(p.gender)}">${p.gender}</span>
          ${p.available ? '<span class="badge badge-available">Disponible</span>' : ''}
        </div>
        ${p.description ? `<p class="product-desc">${p.description}</p>` : ''}
        ${notesPreview}
        <span class="product-price">${money(p.price)}</span>
      </div>
    </div>`;
}

function renderCategoriaView(filter){
  const el = document.getElementById('categoriaView');
  if (PRODUCTS.length === 0){
    el.innerHTML = `<div class="empty-state"><p>Todavía no se cargaron productos. ¡Pronto va a estar lleno de fragancias!</p></div>`;
    return;
  }
  const cats = filter === '__all__' || !filter ? CATEGORIES : [filter];
  let html = '';
  cats.forEach(cat => {
    const items = PRODUCTS.filter(p => p.category === cat);
    if (items.length === 0) return;
    html += `
      <div class="category-block">
        <div class="category-heading">
          <h3>${cat}</h3>
          <span class="count">${items.length} producto${items.length===1?'':'s'}</span>
        </div>
        <div class="product-grid">
          ${items.map(productCard).join('')}
        </div>
      </div>`;
  });
  el.innerHTML = html || `<div class="empty-state"><p>No hay productos en esta categoría todavía.</p></div>`;
}

function renderMarcaView(){
  const el = document.getElementById('marcaView');
  if (BRANDS.length === 0){
    el.innerHTML = `<div class="empty-state"><p>Todavía no se agregaron marcas.</p></div>`;
    return;
  }
  let html = '';
  BRANDS.forEach(b => {
    const brandProducts = PRODUCTS.filter(p => p.brand === b.name);
    html += `
      <div class="brand-block" id="marca-${b.slug}">
        <div class="brand-block-header">
          <div class="brand-logo-sm">${b.logo ? `<img src="${b.logo}" alt="${b.name}">` : `<span class="brand-logo-sm-initial">${b.name.charAt(0)}</span>`}</div>
          <h3>${b.name}</h3>
        </div>`;
    if (brandProducts.length === 0){
      html += `<div class="empty-state"><p>Sin productos cargados aún para esta marca.</p></div>`;
    } else {
      CATEGORIES.forEach(cat => {
        const items = brandProducts.filter(p => p.category === cat);
        if (items.length === 0) return;
        html += `
          <div class="brand-category-group">
            <h4>${cat}</h4>
            <div class="product-grid">${items.map(productCard).join('')}</div>
          </div>`;
      });
    }
    html += `</div>`;
  });
  el.innerHTML = html;
}

function switchView(view){
  const catBtn = document.querySelector('[data-view="categoria"]');
  const marBtn = document.querySelector('[data-view="marca"]');
  const catView = document.getElementById('categoriaView');
  const marView = document.getElementById('marcaView');
  const chips = document.getElementById('categoryChips');
  const titleText = document.getElementById('sectionTitleText');

  if (view === 'marca'){
    catBtn.classList.remove('active'); marBtn.classList.add('active');
    catView.style.display='none'; marView.style.display='block';
    chips.style.display='none';
    titleText.textContent = 'Explorá por Marca';
  } else {
    marBtn.classList.remove('active'); catBtn.classList.add('active');
    marView.style.display='none'; catView.style.display='block';
    chips.style.display='flex';
    titleText.textContent = 'Explorá por Categoría';
  }
}

document.getElementById('viewSwitch').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON'){ switchView(e.target.dataset.view); }
});

renderBrandCarousel();
renderCategoryChips();
renderCategoriaView('__all__');
renderMarcaView();
</script>
